[package]
name    = "line"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[lints]
workspace = true

[dependencies]
dsp = { path = "../dsp" }

[target.'cfg(not(all(target_os = "windows", target_arch = "x86")))'.dependencies]
cpal = "0.18.2"

# On Linux, go through the sound server where there is one. cpal's ALSA host
# opens the hardware itself, which takes the device away from PipeWire or
# PulseAudio and from every other program for as long as it is open; its
# PulseAudio host talks to the server instead (PipeWire answers the same
# protocol), and cpal falls back to ALSA on a machine with no server. See
# `line::host`. Its native PipeWire host (PR 1, SarahRoseLives) lists
# PipeWire's own nodes, virtual loopbacks among them, beside the hardware; it
# needs libpipewire's development files (`libpipewire-0.3-dev`) and libclang
# to build.
[target.'cfg(all(target_os = "linux", not(all(target_os = "windows", target_arch = "x86"))))'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio", "pipewire"] }
