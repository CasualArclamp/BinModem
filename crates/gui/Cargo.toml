[package]
name    = "gui"
version.workspace = true
edition.workspace = true
license.workspace = true
# `cargo run -p gui` is the modem; the other program is asked for by name.
default-run = "binmodem"

[[bin]]
name = "binmodem"
path = "src/main.rs"

# The Review tab as a program of its own: no line, no modem.
[[bin]]
name = "dialsnoop"
path = "src/snoop.rs"

[dependencies]
dsp       = { path = "../dsp" }
fax       = { path = "../fax" }
datapump  = { path = "../datapump" }
ec        = { path = "../ec" }
line      = { path = "../line" }
login     = { path = "../login" }
modem     = { path = "../modem" }
telemetry = { path = "../telemetry" }
at        = { path = "../at" }
terminal  = { path = "../terminal" }
telnet    = { path = "../telnet" }
transfer  = { path = "../transfer" }
ppp       = { path = "../ppp" }
proxy     = { path = "../proxy" }
review    = { path = "../review" }
sip       = { path = "../sip" }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
rfd = "0.17.2"
# PDFs to fax: a renderer written in Rust, so the program stays one file.
hayro = "0.7.1"

[lints]
workspace = true
