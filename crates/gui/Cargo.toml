[package]
name    = "gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "binmodem"
path = "src/main.rs"

[dependencies]
dsp       = { path = "../dsp" }
fax       = { path = "../fax" }
datapump  = { path = "../datapump" }
ec        = { path = "../ec" }
line      = { path = "../line" }
login     = { path = "../login" }
modem     = { path = "../modem" }
telemetry = { path = "../telemetry" }
at        = { path = "../at" }
terminal  = { path = "../terminal" }
telnet    = { path = "../telnet" }
transfer  = { path = "../transfer" }
ppp       = { path = "../ppp" }
proxy     = { path = "../proxy" }
sip       = { path = "../sip" }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
rfd = "0.17.2"

[lints]
workspace = true
