[workspace]
resolver = "3"
members = ["crates/at", "crates/datapump", "crates/dsp", "crates/gui", "crates/line", "crates/telemetry", "crates/terminal"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "MIT"
repository = "https://github.com/local/dialupmodem2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code                   = "deny"

[profile.release]
opt-level = 3
lto       = "thin"
