[workspace]
resolver = "3"
members = ["crates/at", "crates/datapump", "crates/dsp", "crates/ec", "crates/gui", "crates/line", "crates/modem", "crates/ppp", "crates/tcp", "crates/telemetry", "crates/telnet", "crates/transfer", "crates/v8", "crates/terminal"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "GPL-3.0-or-later"
repository = "https://github.com/CasualArclamp/BinModem"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code                   = "deny"

[profile.release]
opt-level = 3
lto       = "thin"
# Nothing reads a backtrace out of a shipped build, and the symbols are most of
# the file.
strip     = true
