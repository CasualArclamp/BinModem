name: Release (Windows XP 32-bit)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-x86:
    name: binmodem-x86.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target i686-pc-windows-msvc
          rustup default stable
          rustc --version

      - name: Build
        env:
          RUSTFLAGS: "-C target-feature=+crt-static -C link-args=/SUBSYSTEM:WINDOWS,5.01"
        run: cargo build --release -p gui --target i686-pc-windows-msvc

      - name: No C runtime dependency
        shell: pwsh
        run: |
          $exe = "target/i686-pc-windows-msvc/release/binmodem.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          $runtime = [regex]::Matches($text, "[A-Za-z0-9_\-]+\.dll") |
              ForEach-Object { $_.Value.ToLower() } |
              Where-Object { $_ -match "vcruntime|api-ms-win-crt|msvcp|ucrtbase" } |
              Sort-Object -Unique
          if ($runtime) {
              Write-Host "::error::imports a C runtime: $($runtime -join ', ')"
              exit 1
          }
          "{0:N1} MB, no C runtime dependency" -f ((Get-Item $exe).Length / 1MB)

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/i686-pc-windows-msvc/release/binmodem.exe dist/binmodem-x86.exe
          (Get-FileHash dist/binmodem-x86.exe -Algorithm SHA256).Hash.ToLower() +
              "  binmodem-x86.exe" | Set-Content -Encoding ascii dist/SHA256SUMS-x86.txt
          Get-Content dist/SHA256SUMS-x86.txt

      - uses: actions/upload-artifact@v4
        with:
          name: binmodem-windows-x86
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release upload "${{ github.ref_name }}" `
                dist/binmodem-x86.exe dist/SHA256SUMS-x86.txt --clobber
          } else {
            gh release create "${{ github.ref_name }}" `
                dist/binmodem-x86.exe dist/SHA256SUMS-x86.txt `
                --title "${{ github.ref_name }}" `
                --notes-file .github/release-notes.md
          }
