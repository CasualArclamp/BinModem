name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: test on windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup ships on the runner image; pinning the toolchain here rather
      # than taking whatever the image happens to carry, because the edition
      # is 2024 and an older stable will not build it at all.
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The suite is the whole argument that this is a modem rather than a
      # program that compiles: handshakes, framing, dictionaries, and a real
      # Bell 103 call decoded to its known plaintext.
      - name: Tests
        run: cargo test --workspace

  # Nobody develops this on Linux and people run it there, so the least CI
  # can do is say that it still builds: the window, with the audio it opens
  # through the sound server (see crates/line/Cargo.toml). Clippy runs here
  # too because code behind cfg(target_os = "linux") is invisible to the job
  # above.
  linux:
    name: build on linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: What the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy -p line -p gui --all-targets -- -D warnings

      - name: Build
        run: cargo build --release -p gui
